version: '3.8'

services:
  # ==================== APP SERVICES ====================
  backend:
    build: ./backend
    container_name: saladasoul_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=db
      - DB_NAME=saladasoul
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      - db
    networks:
      - app_network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: saladasoul_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - app_network

  # ==================== DATABASE ====================
  db:
    container_name: saladasoul_db
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d saladasoul" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: saladasoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
