version: '3.8'

services:
  # ==================== BACKEND API ====================
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: johb_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@johb_db:5432/johb
      - DB_HOST=johb_db
      - DB_NAME=johb
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - DB_SSL=disable
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - johb_network
    volumes:
      - ./backend/uploads:/app/uploads

  # ==================== DATABASE ====================
  db:
    image: postgres:15-alpine
    container_name: johb_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d johb"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: johb
    volumes:
      - johb_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - johb_network

volumes:
  johb_postgres_data:

networks:
  johb_network:
    name: johb_network
    driver: bridge
